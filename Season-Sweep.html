<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Season Sweep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a24'/%3E%3Crect x='11' y='11' width='18' height='18' rx='4' fill='%233d78bf'/%3E%3Crect x='35' y='11' width='18' height='18' rx='4' fill='%23e6b23a'/%3E%3Crect x='11' y='35' width='18' height='18' rx='4' fill='%2345a06a'/%3E%3Crect x='35' y='35' width='18' height='18' rx='4' fill='%23cf7620'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="season-art.js?v=1"></script>
<style>
:root{
  --table-1:#16222e; --table-2:#0c141c;
  --brass:#b98a3c; --brass-hi:#e4c883; --brass-deep:#8a6526;
  --line:rgba(240,235,220,.10); --line-2:rgba(240,235,220,.16);
  --muted:#9aa6b2; --muted-2:#c7d0d9; --paper:#f4efe3;
  --blue:#2f6fc0; --gold:#c99105; --green:#2f9e4f; --orange:#e2701c;
  --mail:#7a5cc0; --noon:#57bfe8;
  --good:#3fbf72;
  --shadow:0 14px 30px -12px rgba(0,0,0,.6);
  --cell:56px; --gap:4px;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
html{-webkit-text-size-adjust:100%}
body{overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
  color:var(--muted-2); font-family:"Archivo",system-ui,"Segoe UI",sans-serif;
  background:radial-gradient(120% 90% at 50% 6%, #223141 0%, var(--table-1) 42%, var(--table-2) 100%);
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Fraunces","Georgia",serif; margin:0; color:var(--paper); font-weight:600}

.btn{border:1px solid var(--brass-deep); cursor:pointer; color:#211a0c; text-decoration:none; display:inline-block;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass)); font-family:inherit;
  padding:.7em 1.3em; border-radius:9px; font-weight:600; font-size:.95rem;
  box-shadow:0 2px 0 var(--brass-deep),0 8px 18px -8px rgba(0,0,0,.7); transition:transform .08s, filter .15s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(2px); box-shadow:0 0 0 var(--brass-deep)}
.btn.ghost{background:transparent; color:var(--muted-2); border-color:var(--line-2); box-shadow:none; font-weight:500}
.btn.ghost:hover{border-color:var(--brass); color:var(--brass-hi)}
.btn:focus-visible{outline:3px solid var(--brass-hi); outline-offset:2px}

#app{width:100%; padding:8px clamp(8px,2vw,18px) 10px; height:100dvh; overflow:hidden; display:flex; flex-direction:column; gap:8px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px}
.brand .mark{width:40px; height:40px; border-radius:9px; display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:5px;
  background:linear-gradient(155deg,#1d2c3c,#101a24); border:1px solid var(--line-2); flex:0 0 auto}
.brand .mark i{border-radius:3px; display:block}
.brand h1{font-size:1.15rem; line-height:1}
.brand .sub{font-size:.72rem; color:var(--muted); letter-spacing:.14em; margin-top:3px}
.tools{display:flex; gap:8px; flex-wrap:wrap}

/* score / moves / level strip */
.hud{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.hud .box{display:flex; flex-direction:column; align-items:center; gap:1px; min-width:84px; padding:5px 12px;
  border:1px solid var(--line); border-radius:11px; background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
.hud .box b{font-family:"Fraunces",serif; font-size:1.2rem; color:var(--brass-hi); line-height:1.1}
.hud .box span{font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.hud .box.low b{color:#ff9d76}

.felt{position:relative; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:clamp(6px,1.4vh,12px); padding:clamp(8px,1.6vh,14px); border-radius:20px; overflow:hidden;
  background:radial-gradient(140% 120% at 50% 0%, rgba(255,255,255,.05), rgba(0,0,0,0) 55%), linear-gradient(180deg,#1c3b34,#122a26);
  border:1px solid rgba(255,255,255,.06); box-shadow:inset 0 2px 30px rgba(0,0,0,.45), var(--shadow)}

/* the appointment book: the level's goals, drawn as little season cards */
.goals{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; z-index:2}
.goal{display:flex; align-items:center; gap:7px; padding:5px 11px 5px 6px; border-radius:12px;
  background:#fdfdfb; border:1px solid #e4dfce; box-shadow:0 6px 14px -10px rgba(0,0,0,.7);
  border-left:6px solid var(--c); transition:opacity .25s, transform .25s}
.goal .gi{width:26px; height:26px; display:block; flex:none}
.goal .gi svg{width:100%; height:100%; display:block}
.goal .gt{display:flex; flex-direction:column; line-height:1.05}
.goal .gt b{font-family:"Fraunces",serif; font-size:.82rem; color:var(--c)}
.goal .gt span{font-size:.68rem; font-weight:700; color:#6b7480; letter-spacing:.04em}
.goal.done{background:#e8f8ee; border-color:#bfe6cd}
.goal.done .gt span{color:#2f8a4c}
.goal.bump{transform:scale(1.12)}

/* ---------------- the board ---------------- */
.boardwrap{position:relative; z-index:2; border-radius:16px; padding:var(--gap);
  background:linear-gradient(180deg,rgba(0,0,0,.26),rgba(0,0,0,.16));
  border:1px solid rgba(255,255,255,.07); box-shadow:inset 0 2px 14px rgba(0,0,0,.5)}
.board{position:relative; touch-action:none;
  width:calc(var(--cols) * (var(--cell) + var(--gap)) - var(--gap));
  height:calc(var(--rows) * (var(--cell) + var(--gap)) - var(--gap))}
.tile{position:absolute; width:var(--cell); height:var(--cell); border-radius:12px; cursor:grab;
  left:0; top:0; display:flex; align-items:center; justify-content:center;
  transform:translate(calc(var(--c) * (var(--cell) + var(--gap))), calc(var(--r) * (var(--cell) + var(--gap))));
  transition:transform .19s cubic-bezier(.3,.85,.4,1), opacity .18s;
  background:var(--bg); border:1px solid var(--bd); box-shadow:0 3px 0 var(--sh), inset 0 1px 0 rgba(255,255,255,.55);
  will-change:transform}
.tile svg{width:74%; height:74%; display:block; pointer-events:none}
.tile[data-s=Winter]{--bg:#eaf3fd; --bd:#c2dbf3; --sh:#b9d2ec}
.tile[data-s=Spring]{--bg:#fdfbe3; --bd:#ece2ae; --sh:#e3d79c}
.tile[data-s=Summer]{--bg:#e9f8ec; --bd:#bfe4c6; --sh:#b2dcba}
.tile[data-s=Fall]{--bg:#fdf0e4; --bd:#f0d3b4; --sh:#e8c6a2}
.tile.sel{outline:3px solid var(--brass-hi); outline-offset:-2px; z-index:6}
.tile.pop{animation:pop .2s ease-in forwards; z-index:5; pointer-events:none}
@keyframes pop{60%{transform:translate(calc(var(--c) * (var(--cell) + var(--gap))), calc(var(--r) * (var(--cell) + var(--gap)))) scale(1.22)}
  100%{transform:translate(calc(var(--c) * (var(--cell) + var(--gap))), calc(var(--r) * (var(--cell) + var(--gap)))) scale(0); opacity:0}}
.tile.born{animation:born .24s ease-out}
@keyframes born{from{opacity:0}to{opacity:1}}
.tile.nudge{animation:nudge .3s}
@keyframes nudge{0%,100%{filter:none}50%{filter:brightness(1.35)}}

/* MAIL tile — a letter that sweeps its whole row or column */
.tile.mail{--bg:linear-gradient(160deg,#f3eefc,#e4daf7); --bd:#cdbcee; --sh:#c0ace6}
.tile.mail::after{content:""; position:absolute; border-radius:3px; background:var(--mail); opacity:.55}
.tile.mail[data-dir=row]::after{left:6%; right:6%; height:14%}
.tile.mail[data-dir=col]::after{top:6%; bottom:6%; width:14%}
.tile.mail .glyph{font-size:calc(var(--cell) * .48); color:var(--mail); line-height:1; z-index:1}
/* NOON tile — the clock that clears a whole season */
.tile.noon{--bg:radial-gradient(circle at 34% 30%,#ffffff,#ddf1fb 70%,#bfe4f6); --bd:#a9dcf2; --sh:#96cfe8;
  animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%,100%{box-shadow:0 3px 0 var(--sh), inset 0 1px 0 rgba(255,255,255,.55)}
  50%{box-shadow:0 3px 0 var(--sh), inset 0 1px 0 rgba(255,255,255,.55), 0 0 14px 2px rgba(87,191,232,.75)}}

.hint{font-size:.85rem; color:#bfe0cf; min-height:1.15em; text-align:center; z-index:2}
.hint.ok{color:#9ff0bd}

/* floating score pops */
.fx{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:8}
.fx b{position:absolute; font-family:"Fraunces",serif; font-size:1rem; color:#fff6d8;
  text-shadow:0 2px 6px rgba(0,0,0,.7); animation:rise .85s ease-out forwards}
@keyframes rise{from{transform:translate(-50%,0); opacity:0}
  25%{opacity:1} to{transform:translate(-50%,-46px); opacity:0}}
.combo{position:absolute; left:50%; top:16%; transform:translateX(-50%); z-index:9; pointer-events:none;
  font-family:"Fraunces",serif; font-size:clamp(1.3rem,4vw,2rem); color:var(--brass-hi);
  text-shadow:0 3px 12px rgba(0,0,0,.8); opacity:0}
.combo.show{animation:comboPop .8s ease-out}
@keyframes comboPop{0%{opacity:0; transform:translateX(-50%) scale(.6)}
  30%{opacity:1; transform:translateX(-50%) scale(1.1)} 100%{opacity:0; transform:translateX(-50%) scale(1)}}

/* overlays */
.veil{position:absolute; inset:0; background:rgba(8,16,12,.8); backdrop-filter:blur(3px); display:none;
  align-items:center; justify-content:center; padding:16px; z-index:20; overflow:auto}
.veil.on{display:flex}
.sheet{background:linear-gradient(170deg,#1f2d3c,#131d28); border:1px solid var(--line-2); border-radius:18px;
  padding:clamp(16px,3vw,26px); max-width:560px; width:100%; box-shadow:var(--shadow); color:var(--muted-2)}
.sheet h2{font-size:1.4rem; margin-bottom:8px}
.sheet p,.sheet li{font-size:.92rem; line-height:1.5}
.sheet ul{padding-left:18px; margin:8px 0}
.sheet .row{display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap}
.sheet .key{display:flex; align-items:center; gap:9px; margin:8px 0}
.sheet .key .chip{width:34px; height:34px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center;
  background:#fdfdfb; border:1px solid #e4dfce}
.sheet .key .chip svg{width:76%; height:76%}
.tally{display:flex; gap:18px; justify-content:center; margin:14px 0; flex-wrap:wrap}
.tally div{text-align:center}
.tally b{display:block; font-family:"Fraunces",serif; font-size:1.9rem; color:var(--brass-hi); line-height:1.1}
.tally span{font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}

@media (max-width:620px){ .brand .sub{display:none} }
@media (prefers-reduced-motion:reduce){ .tile{transition:none} .tile.noon{animation:none} }
</style>

<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="mark"><i style="background:var(--blue)"></i><i style="background:var(--gold)"></i>
        <i style="background:var(--green)"></i><i style="background:var(--orange)"></i></div>
      <div><h1>Season Sweep</h1><div class="sub">Mini game · match the seasons</div></div>
    </div>
    <div class="tools">
      <a class="btn ghost" href="index.html">← Parlor</a>
      <button class="btn ghost" id="btnHelp">How to play</button>
      <button class="btn ghost" id="btnNew">New game</button>
    </div>
  </div>

  <div class="hud">
    <div class="box"><b id="hLevel">1</b><span>Level</span></div>
    <div class="box"><b id="hScore">0</b><span>Score</span></div>
    <div class="box" id="boxMoves"><b id="hMoves">22</b><span>Moves left</span></div>
  </div>

  <div class="felt">
    <div class="fx" id="fx" aria-hidden="true"></div>
    <div class="combo" id="combo" aria-hidden="true"></div>

    <div class="goals" id="goals"></div>

    <div class="boardwrap">
      <div class="board" id="board" role="grid" aria-label="Season board. Swap two touching tiles to line up three."></div>
    </div>

    <div class="hint" id="hint">Swap two tiles that touch to line up three of a season.</div>
  </div>

  <div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
</div>

<script>
/* =====================================================================
   SEASON SWEEP — an IGAA Parlor mini game.

   A match-three built out of the Parlor's own deck: the tiles are the
   four season motifs (Winter snowflake, Spring daffodils, Summer tree,
   Fall maple leaves) drawn from the shared season-art.js, and the two
   power tiles are the deck's own oddities — MAIL, which delivers a whole
   row or column, and NOON, which clears every tile of one season.

   Each level hands you an appointment book: keep every appointment
   before the moves run out.
   ===================================================================== */
"use strict";

const $ = id => document.getElementById(id);
const SEASONS = ["Winter", "Spring", "Summer", "Fall"];
const COLOR = { Winter:"#2f6fc0", Spring:"#c99105", Summer:"#2f9e4f", Fall:"#e2701c" };
const MONTHS = {
  Winter:"Dec · Jan · Feb", Spring:"Mar · Apr · May",
  Summer:"Jun · Jul · Aug", Fall:"Sep · Oct · Nov"
};

let COLS = 8, ROWS = 8;
const BASE_MOVES = 22;
const PER_TILE = 60;

/* ---- state ---- */
let grid = [];            // grid[r][c] = tile | null
let byId = new Map();     // id -> tile
let nodes = new Map();    // id -> DOM node
let uid = 0;
let level = 1, score = 0, moves = BASE_MOVES;
let goals = [];           // [{season, need, got}]
let busy = false, sel = null, over = false;

const clockGlyph =
  '<svg viewBox="0 0 24 24" aria-hidden="true">' +
  '<circle cx="12" cy="12" r="9.4" fill="#fff" stroke="#3ba7d6" stroke-width="1.9"/>' +
  '<line x1="12" y1="12" x2="12" y2="5.6" stroke="#3ba7d6" stroke-width="1.9" stroke-linecap="round"/>' +
  '<line x1="12" y1="12" x2="12" y2="6.8" stroke="#4a525b" stroke-width="1.5" stroke-linecap="round"/>' +
  '<circle cx="12" cy="12" r="1.2" fill="#4a525b"/></svg>';

const art = s => (window.seasonIcon ? window.seasonIcon(s, "") : "");

/* ---- board helpers ---- */
const inBoard = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;
const at = (r, c) => (inBoard(r, c) ? grid[r][c] : null);
const pick = a => a[Math.floor(Math.random() * a.length)];

function makeTile(season, kind, dir) {
  const t = { id: ++uid, season: season || null, kind: kind || "season", dir: dir || null, r: 0, c: 0 };
  byId.set(t.id, t);
  return t;
}
// a tile only matches by season; NOON has none, so it never joins a run
const matchKey = t => (t && t.kind !== "noon" ? t.season : null);

function newBoard() {
  grid = [];
  byId = new Map();
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      let s, guard = 0;
      do {
        s = pick(SEASONS);
        guard++;
      } while (guard < 30 && (
        (c >= 2 && matchKey(at(r, c - 1)) === s && matchKey(at(r, c - 2)) === s) ||
        (r >= 2 && matchKey(at(r - 1, c)) === s && matchKey(at(r - 2, c)) === s)
      ));
      const t = makeTile(s);
      t.r = r; t.c = c;
      grid[r][c] = t;
    }
  }
  if (!anyMove()) return newBoard();   // vanishingly rare, but be sure
}

/* ---- matching ---- */
function findRuns() {
  const runs = [];
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const k = matchKey(at(r, c));
      let e = c;
      while (k && e + 1 < COLS && matchKey(at(r, e + 1)) === k) e++;
      if (k && e - c + 1 >= 3) {
        const cells = [];
        for (let i = c; i <= e; i++) cells.push(grid[r][i]);
        runs.push({ cells, dir: "row", season: k });
      }
      c = e + 1;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const k = matchKey(at(r, c));
      let e = r;
      while (k && e + 1 < ROWS && matchKey(at(e + 1, c)) === k) e++;
      if (k && e - r + 1 >= 3) {
        const cells = [];
        for (let i = r; i <= e; i++) cells.push(grid[i][c]);
        runs.push({ cells, dir: "col", season: k });
      }
      r = e + 1;
    }
  }
  return runs;
}

/* does any legal swap create a run? (used for the shuffle check) */
function anyMove() {
  const trySwap = (r1, c1, r2, c2) => {
    const a = grid[r1][c1], b = grid[r2][c2];
    if (!a || !b) return false;
    if (a.kind === "noon" || b.kind === "noon") return true;   // NOON always plays
    grid[r1][c1] = b; grid[r2][c2] = a;
    const ok = findRuns().length > 0;
    grid[r1][c1] = a; grid[r2][c2] = b;
    return ok;
  };
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c + 1 < COLS && trySwap(r, c, r, c + 1)) return true;
      if (r + 1 < ROWS && trySwap(r, c, r + 1, c)) return true;
    }
  }
  return false;
}

/* ---- rendering ---- */
function tileHTML(t) {
  if (t.kind === "noon") return clockGlyph;
  if (t.kind === "mail") return '<span class="glyph">✉</span>';
  return art(t.season);
}
function classOf(t) {
  return "tile" + (t.kind === "mail" ? " mail" : t.kind === "noon" ? " noon" : "");
}
function place(node, t) {
  node.style.setProperty("--r", t.r);
  node.style.setProperty("--c", t.c);
}
function render() {
  const board = $("board");
  board.style.setProperty("--cols", COLS);
  board.style.setProperty("--rows", ROWS);
  const seen = new Set();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = grid[r][c];
    if (!t) continue;
    t.r = r; t.c = c;
    seen.add(t.id);
    let node = nodes.get(t.id);
    if (!node) {
      node = document.createElement("div");
      node.className = classOf(t) + " born";
      node.dataset.id = t.id;
      node.innerHTML = tileHTML(t);
      nodes.set(t.id, node);
      board.appendChild(node);
    } else {
      node.className = classOf(t) + (sel === t.id ? " sel" : "");
    }
    if (t.kind === "season") node.dataset.s = t.season;
    else if (t.kind === "mail") { node.dataset.s = t.season; node.dataset.dir = t.dir; }
    else node.removeAttribute("data-s");
    place(node, t);
  }
  // drop any node whose tile is gone
  nodes.forEach((node, id) => {
    if (!seen.has(id)) { node.remove(); nodes.delete(id); }
  });
  $("hLevel").textContent = level;
  $("hScore").textContent = score.toLocaleString();
  $("hMoves").textContent = moves;
  $("boxMoves").classList.toggle("low", moves <= 5);
  requestAnimationFrame(window.__igaaFit || fitBoard);
}

function renderGoals() {
  $("goals").innerHTML = goals.map((g, i) => `
    <div class="goal ${g.got >= g.need ? "done" : ""}" data-gi="${i}" style="--c:${COLOR[g.season]}">
      <span class="gi">${art(g.season)}</span>
      <span class="gt"><b>${g.season}</b><span>${Math.min(g.got, g.need)} / ${g.need}</span></span>
    </div>`).join("");
}

/* ---- level setup ---- */
function startLevel(n) {
  level = n;
  moves = BASE_MOVES + Math.min(8, (n - 1) * 2);
  const need = 8 + (n - 1) * 3;
  const chosen = SEASONS.slice().sort(() => Math.random() - 0.5).slice(0, Math.min(4, 2 + Math.floor(n / 2)));
  goals = chosen.map(s => ({ season: s, need, got: 0 }));
  sel = null; busy = false; over = false;
  nodes.forEach(n2 => n2.remove());
  nodes = new Map();
  newBoard();
  renderGoals();
  render();
  say("Swap two tiles that touch to line up three of a season.");
}
function newGame() {
  score = 0;
  $("veil").classList.remove("on");
  startLevel(1);
}

/* ---- input: tap two tiles, or drag one onto its neighbour ---- */
let drag = null;
$("board").addEventListener("pointerdown", e => {
  if (busy || over) return;
  const node = e.target.closest(".tile");
  if (!node) return;
  const t = byId.get(+node.dataset.id);
  if (!t) return;
  drag = { id: t.id, x: e.clientX, y: e.clientY, moved: false };
  $("board").setPointerCapture(e.pointerId);
});
$("board").addEventListener("pointermove", e => {
  if (!drag || drag.moved || busy) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const cell = $("board").getBoundingClientRect().width / COLS;
  if (Math.hypot(dx, dy) < cell * 0.45) return;
  drag.moved = true;
  const t = byId.get(drag.id);
  const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, dx > 0 ? 1 : -1] : [dy > 0 ? 1 : -1, 0];
  sel = null;
  trySwap(t, at(t.r + dr, t.c + dc));
});
$("board").addEventListener("pointerup", e => {
  if (!drag) return;
  const wasTap = !drag.moved;
  const id = drag.id;
  drag = null;
  if (!wasTap || busy || over) return;
  const t = byId.get(id);
  if (!t) return;
  if (sel === null) { sel = t.id; render(); return; }
  if (sel === t.id) { sel = null; render(); return; }
  const a = byId.get(sel);
  sel = null;
  if (a && Math.abs(a.r - t.r) + Math.abs(a.c - t.c) === 1) trySwap(a, t);
  else { sel = t.id; }
  render();
});
$("board").addEventListener("pointercancel", () => { drag = null; });

/* ---- the swap ---- */
function swapCells(a, b) {
  grid[a.r][a.c] = b;
  grid[b.r][b.c] = a;
  const ar = a.r, ac = a.c;
  a.r = b.r; a.c = b.c;
  b.r = ar; b.c = ac;
  const na = nodes.get(a.id), nb = nodes.get(b.id);
  if (na) place(na, a);
  if (nb) place(nb, b);
}

async function trySwap(a, b) {
  if (!a || !b || busy || over) return;
  busy = true;
  sel = null;
  swapCells(a, b);
  await wait(200);

  // NOON is a wild: swapping it plays it straight away
  if (a.kind === "noon" || b.kind === "noon") {
    const noon = a.kind === "noon" ? a : b, other = noon === a ? b : a;
    spendMove();
    await playNoon(noon, other);
    await settle();
    finishTurn();
    return;
  }

  if (findRuns().length === 0) {          // no match — put them back
    swapCells(a, b);
    await wait(200);
    say("That swap doesn't line up three. Try another.");
    busy = false;
    render();
    return;
  }

  spendMove();
  await settle();
  finishTurn();
}

const wait = ms => new Promise(res => setTimeout(res, ms));
function spendMove() { moves = Math.max(0, moves - 1); }

/* ---- resolve: clear -> score -> gravity -> refill -> repeat ---- */
async function settle() {
  let chain = 0;
  for (;;) {
    const runs = findRuns();
    if (!runs.length) break;
    chain++;

    // work out which tiles die, and where a power tile is born
    const dying = new Set();
    const births = [];
    for (const run of runs) {
      run.cells.forEach(t => dying.add(t));
      if (run.cells.length >= 5) {
        births.push({ at: run.cells[Math.floor(run.cells.length / 2)], kind: "noon", season: null });
      } else if (run.cells.length === 4) {
        births.push({
          at: run.cells[Math.floor(run.cells.length / 2)], kind: "mail",
          season: run.season, dir: run.dir === "row" ? "col" : "row"
        });
      }
    }
    // a MAIL caught in the blast delivers its whole line
    let queue = [...dying];
    while (queue.length) {
      const t = queue.shift();
      if (t.kind !== "mail") continue;
      for (const v of lineOf(t)) if (!dying.has(v)) { dying.add(v); queue.push(v); }
    }
    births.forEach(b => dying.delete(b.at));

    await clearTiles([...dying], chain);

    // power tiles take the place of the run they came from
    for (const b of births) {
      const t = makeTile(b.season, b.kind, b.dir);
      t.r = b.at.r; t.c = b.at.c;
      grid[t.r][t.c] = t;
      byId.delete(b.at.id);
      const old = nodes.get(b.at.id);
      if (old) { old.remove(); nodes.delete(b.at.id); }
    }

    if (chain > 1) showCombo(chain);
    collapse();
    render();
    await wait(230);
  }
}

function lineOf(t) {
  const out = [];
  if (t.dir === "row") { for (let c = 0; c < COLS; c++) { const v = at(t.r, c); if (v) out.push(v); } }
  else { for (let r = 0; r < ROWS; r++) { const v = at(r, t.c); if (v) out.push(v); } }
  return out;
}

async function playNoon(noon, other) {
  let doomed;
  if (other.kind === "noon") {                      // NOON + NOON: clear the table
    doomed = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c]) doomed.push(grid[r][c]);
    say("Noon and noon — the whole table clears!", "ok");
  } else if (other.kind === "mail") {                // NOON + MAIL: sweep both ways
    doomed = [];
    for (let c = 0; c < COLS; c++) { const v = at(other.r, c); if (v) doomed.push(v); }
    for (let r = 0; r < ROWS; r++) { const v = at(r, other.c); if (v) doomed.push(v); }
    say("Special delivery — a whole row and column!", "ok");
  } else {                                           // NOON + season: clear that season
    doomed = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const v = grid[r][c];
      if (v && v.season === other.season) doomed.push(v);
    }
    say("Noon clears every " + other.season + " tile!", "ok");
  }
  const set = new Set(doomed);
  set.add(noon);
  set.add(other);
  let queue = [...set];
  while (queue.length) {
    const t = queue.shift();
    if (t.kind !== "mail") continue;
    for (const v of lineOf(t)) if (!set.has(v)) { set.add(v); queue.push(v); }
  }
  await clearTiles([...set], 2);
  collapse();
  render();
  await wait(230);
}

async function clearTiles(list, chain) {
  if (!list.length) return;
  const mult = Math.min(chain, 6);
  let gained = 0;
  for (const t of list) {
    if (t.season) {
      const g = goals.find(x => x.season === t.season);
      if (g && g.got < g.need) {
        g.got++;
        bumpGoal(t.season);
      }
    }
    gained += PER_TILE * mult;
    grid[t.r][t.c] = null;
    byId.delete(t.id);
    const node = nodes.get(t.id);
    if (node) {
      node.classList.add("pop");
      nodes.delete(t.id);
      setTimeout(() => node.remove(), 210);
    }
  }
  score += gained;
  popScore(list, gained);
  renderGoals();
  $("hScore").textContent = score.toLocaleString();
  await wait(190);
}

/* gravity, then refill the gaps from the top */
function collapse() {
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      const t = grid[r][c];
      if (!t) continue;
      grid[r][c] = null;
      grid[write][c] = t;
      t.r = write; t.c = c;
      write--;
    }
    for (let r = write; r >= 0; r--) {
      const t = makeTile(pick(SEASONS));
      t.r = r; t.c = c;
      grid[r][c] = t;
    }
  }
}

/* ---- end of turn ---- */
function finishTurn() {
  busy = false;
  render();
  if (goals.every(g => g.got >= g.need)) return levelWon();
  if (moves <= 0) return gameOver();
  if (!anyMove()) {
    say("No moves left on the board — reshuffling.");
    reshuffle();
  }
}
function reshuffle() {
  const list = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c]) list.push(grid[r][c]);
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  let k = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = list[k++];
    grid[r][c] = t; t.r = r; t.c = c;
  }
  render();
  if (!anyMove() || findRuns().length) { startLevel(level); }
}

function levelWon() {
  over = true;
  const bonus = moves * 120;
  score += bonus;
  $("sheet").innerHTML = `
    <h2>Every appointment kept!</h2>
    <p>Level ${level} is done — and ${moves} spare move${moves === 1 ? "" : "s"} turned into bonus points.</p>
    <div class="tally">
      <div><b>${goals.length}</b><span>Appointments</span></div>
      <div><b>+${bonus.toLocaleString()}</b><span>Move bonus</span></div>
      <div><b>${score.toLocaleString()}</b><span>Score</span></div>
    </div>
    <div class="row">
      <a class="btn ghost" href="index.html" data-no-confirm>← Parlor</a>
      <button class="btn" id="next">Level ${level + 1} ▶</button>
    </div>`;
  $("veil").classList.add("on");
  $("next").onclick = () => { $("veil").classList.remove("on"); startLevel(level + 1); };
}

function gameOver() {
  over = true;
  const left = goals.reduce((n, g) => n + Math.max(0, g.need - g.got), 0);
  $("sheet").innerHTML = `
    <h2>Out of moves</h2>
    <p>You were <b>${left}</b> tile${left === 1 ? "" : "s"} short of keeping every appointment on level ${level}.</p>
    <div class="tally">
      <div><b>${level}</b><span>Level</span></div>
      <div><b>${score.toLocaleString()}</b><span>Score</span></div>
    </div>
    <div class="row">
      <a class="btn ghost" href="index.html" data-no-confirm>← Parlor</a>
      <button class="btn ghost" id="retry">Try level ${level} again</button>
      <button class="btn" id="fresh">New game</button>
    </div>`;
  $("veil").classList.add("on");
  $("retry").onclick = () => { $("veil").classList.remove("on"); startLevel(level); };
  $("fresh").onclick = newGame;
}

/* ---- little bits of juice ---- */
function say(msg, kind) {
  const h = $("hint");
  h.textContent = msg || "";
  h.className = "hint" + (kind ? " " + kind : "");
}
function bumpGoal(season) {
  const i = goals.findIndex(g => g.season === season);
  const el = $("goals").querySelector(`[data-gi="${i}"]`);
  if (!el) return;
  el.classList.add("bump");
  setTimeout(() => el.classList.remove("bump"), 220);
}
function popScore(list, gained) {
  if (!list.length || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const t = list[Math.floor(list.length / 2)];
  const board = $("board").getBoundingClientRect(), fx = $("fx").getBoundingClientRect();
  const cell = board.width / COLS;
  const x = board.left - fx.left + (t.c + 0.5) * cell;
  const y = board.top - fx.top + (t.r + 0.5) * cell;
  const b = document.createElement("b");
  b.textContent = "+" + gained;
  b.style.left = x + "px";
  b.style.top = y + "px";
  $("fx").appendChild(b);
  setTimeout(() => b.remove(), 900);
}
function showCombo(n) {
  const el = $("combo");
  el.textContent = n >= 4 ? "Sweep! ×" + n : n === 3 ? "Triple!" : "Double!";
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
}

/* ---- help ---- */
$("btnHelp").onclick = () => {
  $("sheet").innerHTML = `
    <h2>How to play</h2>
    <p>Swap two tiles that touch — by tapping both, or dragging one onto its neighbour —
       to line up <b>three or more</b> of the same season. A swap only counts if it makes a line.</p>
    <p>Each level gives you an <b>appointment book</b> at the top. Clear that many tiles of each
       season before your moves run out.</p>
    <div class="key"><span class="chip">${art("Summer")}</span>
      <span>The four seasons — the same symbols as the printed cards.</span></div>
    <div class="key"><span class="chip" style="color:var(--mail); font-size:1.3rem; font-family:serif">✉</span>
      <span><b>MAIL</b> — made by a line of four. Clear it and it delivers a whole row or column.</span></div>
    <div class="key"><span class="chip">${clockGlyph}</span>
      <span><b>NOON</b> — made by a line of five. Swap it with any tile to clear every tile of that season.
        Two NOONs together clear the table.</span></div>
    <ul>
      <li>Chains score more: every extra cascade multiplies the points.</li>
      <li>Spare moves turn into bonus points when you finish a level.</li>
    </ul>
    <div class="row"><button class="btn" id="closeHelp">Got it</button></div>`;
  $("veil").classList.add("on");
  $("closeHelp").onclick = () => $("veil").classList.remove("on");
};
$("veil").addEventListener("click", e => { if (e.target === $("veil") && !over) $("veil").classList.remove("on"); });
$("btnNew").onclick = newGame;

/* ---- fit the board to the viewport (no scrolling, ever) ---- */
function fitBoard() {
  const felt = document.querySelector(".felt");
  if (!felt) return;
  const H = sel2 => { const e = document.querySelector(sel2); return e ? e.getBoundingClientRect().height : 0; };
  const box = felt.getBoundingClientRect();
  const gap = 4;
  const chrome = H(".goals") + H(".hint") + 54;
  const byH = (box.height - chrome - gap * 2) / ROWS - gap;
  const byW = (box.width - 26 - gap * 2) / COLS - gap;
  const cell = Math.max(26, Math.min(74, byH, byW));
  document.documentElement.style.setProperty("--cell", cell.toFixed(1) + "px");
  document.documentElement.style.setProperty("--gap", gap + "px");
}

/* a narrow phone gets a narrower board so the tiles stay tappable */
if (window.innerWidth < 430) COLS = 7;

newGame();
</script>
