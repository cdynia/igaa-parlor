<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IGAA Parlor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<title>IGAA Parlor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a24'/%3E%3Crect x='12' y='14' width='9' height='12' rx='2' fill='%233d78bf'/%3E%3Crect x='22' y='14' width='9' height='12' rx='2' fill='%23e6b23a'/%3E%3Crect x='32' y='14' width='9' height='12' rx='2' fill='%2345a06a'/%3E%3Crect x='42' y='14' width='9' height='12' rx='2' fill='%23cf7620'/%3E%3Ctext x='32' y='47' font-family='Georgia' font-size='19' fill='%23e6d2a0' text-anchor='middle' font-weight='700'%3EIGAA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --paper:#fdfbf5; --ink:#20242b; --muted:#5b6573; --brass:#c9a24a;
  --blue:#3d78bf; --yellow:#e6b23a; --green:#45a06a; --orange:#cf7620; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; overflow-x:hidden; color:#e9edf2; -webkit-font-smoothing:antialiased;
  font-family:"Archivo",system-ui,"Segoe UI",sans-serif;
  background:#0e1826 radial-gradient(130% 90% at 50% 0%, #2b425c 0%, #20344a 40%, #0e1826 100%) fixed}
.wrap{max-width:1000px; margin:0 auto; padding:clamp(20px,4vh,40px) clamp(16px,4vw,32px)}

.head{text-align:center; margin-bottom:clamp(8px,2vh,16px)}
.tabs{display:inline-flex; gap:5px; margin-bottom:10px}
.tabs i{width:14px; height:30px; border-radius:4px; display:block}
h1{font-family:"Fraunces",Georgia,serif; font-weight:700; margin:0; color:#fff; font-size:clamp(2rem,6vw,3rem); line-height:1}
.sub{margin:8px 0 0; color:#b9c6d4; font-size:clamp(1rem,2.6vw,1.15rem)}

/* ---- age sections ---- */
.age-head{display:flex; align-items:center; gap:12px; margin:clamp(22px,3.5vh,32px) 0 12px;
  padding-bottom:8px; border-bottom:1px solid rgba(201,162,74,.3)}
.age-badge{flex:none; display:inline-flex; align-items:center; justify-content:center; min-width:4.6em;
  padding:.35em .8em; border-radius:999px; background:var(--band); color:#fff; font-weight:800; font-size:1.02rem; letter-spacing:.01em}
.age-head h2{font-family:"Fraunces",Georgia,serif; font-weight:700; color:#fff; font-size:clamp(1.25rem,3.6vw,1.5rem); margin:0; line-height:1.1}
.age-head p{margin:2px 0 0; color:#b9c6d4; font-size:.95rem}

.games{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px}
.game{display:flex; flex-direction:column; gap:6px; text-decoration:none; padding:14px 14px 13px; border-radius:16px;
  background:var(--paper); color:var(--ink); border-top:6px solid var(--accent); box-shadow:0 10px 24px -14px rgba(0,0,0,.8);
  transition:transform .12s ease, box-shadow .12s ease}
.game:hover{transform:translateY(-4px); box-shadow:0 18px 34px -16px rgba(0,0,0,.9)}
.game:focus-visible{outline:3px solid #f1d58c; outline-offset:2px}
.game .top{display:flex; align-items:center; gap:10px}
.game .emoji{font-size:2rem; line-height:1; flex:none}
.game .name{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:1.12rem; line-height:1.1}
.game .desc{font-size:.92rem; line-height:1.35; color:var(--muted)}
.game .meta{margin-top:auto; padding-top:4px; font-size:.84rem; font-weight:700; color:#6b7684}
@media (prefers-reduced-motion:reduce){ .game{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="tabs"><i style="background:var(--blue)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i><i style="background:var(--orange)"></i></div>
    <h1>IGAA Parlor</h1>
    <p class="sub">Card games that teach seasons, months, days, and time.</p>
  </div>
  <div id="sections"></div>
</div>

<script>
/* =========================================================================
   AGE GROUPS — a game lands in the group that fits its minimum age.
   ========================================================================= */
const AGE_GROUPS = [
  { label:"Ages 3–5", min:3, max:5,  title:"Little kids",          blurb:"Colors, seasons, and taking turns.", band:"#e2701c" },
  { label:"Ages 6–8", min:6, max:8,  title:"Kids",                 blurb:"Months, days, and telling time.",    band:"#2f9e4f" },
  { label:"Ages 9+",  min:9, max:99, title:"Big kids & grown-ups", blurb:"More strategy and scoring.",         band:"#2f6fc0" },
];

/* =========================================================================
   ADD A NEW GAME HERE  ▸  add one entry, drop its .html file in this folder.
   age  = minimum age from the rule sheet ("Ages:" line).
   type = the rule sheet's "Type:" line (IGAA | Time | Other) — kept for reference.
   ========================================================================= */
const GAMES = [
  { file:"Level-1-Seasons.html",        age:3, type:"IGAA",  name:"Level 1 Seasons",        emoji:"🚂", players:"2–4 players",    accent:"#e2701c", desc:"Ride the season train and trade cards to make an appointment." },
  { file:"Times-Up-Jr.html",            age:6, type:"Other", name:"Times Up",               emoji:"⏰", players:"2–8 players",    accent:"#d1492f", desc:"Flip cards to find the months of each season before Noon shows up." },
  { file:"IGAA-Beginner.html",          age:6, type:"IGAA",  name:"Appointment",            emoji:"📅", players:"2–8 players",    accent:"#c78a2e", desc:"Collect a season, a day, and a time in the same color." },
  { file:"Double-Appointment.html",     age:6, type:"IGAA",  name:"Double Appointment",     emoji:"🔒", players:"2 or 4 players", accent:"#2f9e4f", desc:"Pass cards back and forth to finish your birthday-month appointment." },
  { file:"Priority-Mail.html",          age:6, type:"Other", name:"Priority Mail",          emoji:"📬", players:"2–4 players",    accent:"#2f8f8a", desc:"Match cards from the deck to your mail. Five versions, easy to harder." },
  { file:"IGAA-Advanced.html",          age:7, type:"IGAA",  name:"Appointment Plus",       emoji:"✉️", players:"2–8 players",    accent:"#7a5cc0", desc:"Appointment with mail and good news / bad news surprises." },
  { file:"Finish-the-Appointment.html", age:7, type:"IGAA",  name:"Finish the Appointment", emoji:"🧩", players:"2–6 players",    accent:"#e2701c", desc:"Take turns building appointments. Place the last card to win it." },
  { file:"Center-Stage.html",           age:7, type:"IGAA",  name:"Center Stage",           emoji:"⭐", players:"2–4 players",    accent:"#6f3aa3", desc:"Spin and move around the board to make rainbow appointments." },
  { file:"Ducks-on-the-Lake.html",      age:7, type:"Time",  name:"Ducks on the Lake",      emoji:"🦆", players:"2–4 players",    accent:"#2f8fd0", desc:"Match Time cards to send your duck swimming. Practices AM and PM." },
  { file:"Time-to-Travel.html",         age:7, type:"Time",  name:"It's Time to Travel",    emoji:"🚗", players:"2–4 players",    accent:"#2f6fc0", desc:"Travel around the clock and practice reading the time." },
  { file:"12-Appointments.html",        age:9, type:"IGAA",  name:"12 Appointments",        emoji:"🔢", players:"2–4 players",    accent:"#2f9e4f", desc:"Race to claim appointment types and upgrade to bigger points." },
  { file:"Appointment-Taker.html",      age:9, type:"IGAA",  name:"Appointment Taker",      emoji:"🎯", players:"2–4 players",    accent:"#2f6fc0", desc:"Build the best appointments, or take them from other players." },
  { file:"Season-Wheel.html",           age:9, type:"Other", name:"Season Wheel",           emoji:"🎡", players:"2–4 players",    accent:"#2f9e4f", desc:"Make combos from 12 cards, then spin to complete them." },
];

/* ---- render (no need to edit below) ---- */
document.getElementById("sections").innerHTML = AGE_GROUPS.map(grp => {
  const games = GAMES.filter(g => g.age >= grp.min && g.age <= grp.max);
  if (!games.length) return "";
  return `
  <section aria-label="${grp.label}">
    <div class="age-head" style="--band:${grp.band}">
      <span class="age-badge">${grp.label}</span>
      <div><h2>${grp.title}</h2><p>${grp.blurb}</p></div>
    </div>
    <div class="games">${games.map(g => `
      <a class="game" href="${g.file}" style="--accent:${g.accent}">
        <span class="top"><span class="emoji" aria-hidden="true">${g.emoji}</span><span class="name">${g.name}</span></span>
        <span class="desc">${g.desc}</span>
        <span class="meta">Ages ${g.age}+ · ${g.players}</span>
      </a>`).join("")}
    </div>
  </section>`;
}).join("");
</script>
</body>
</html>
