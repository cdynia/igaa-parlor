<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IGAA Parlor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<title>IGAA Parlor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a24'/%3E%3Crect x='12' y='14' width='9' height='12' rx='2' fill='%233d78bf'/%3E%3Crect x='22' y='14' width='9' height='12' rx='2' fill='%23e6b23a'/%3E%3Crect x='32' y='14' width='9' height='12' rx='2' fill='%2345a06a'/%3E%3Crect x='42' y='14' width='9' height='12' rx='2' fill='%23cf7620'/%3E%3Ctext x='32' y='47' font-family='Georgia' font-size='19' fill='%23e6d2a0' text-anchor='middle' font-weight='700'%3EIGAA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --bg-1:#20344a; --bg-2:#0e1826; --paper:#fdfbf5; --ink:#20242b;
  --blue:#3d78bf; --yellow:#e6b23a; --green:#45a06a; --orange:#cf7620;
  --brass:#c9a24a; --brass-hi:#f1d58c; }
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{overflow-x:hidden}
body{margin:0; font-family:"Archivo",system-ui,"Segoe UI",sans-serif;
  background:radial-gradient(130% 90% at 50% 0%, #2b425c 0%, var(--bg-1) 40%, var(--bg-2) 100%) fixed;
  background-color:var(--bg-2);
  color:#e9edf2; min-height:100%; -webkit-font-smoothing:antialiased}
.wrap{max-width:1120px; margin:0 auto; min-height:100vh; padding:clamp(20px,4vh,44px) clamp(14px,4vw,32px); display:flex; flex-direction:column}
.head{text-align:center; margin-bottom:clamp(8px,1.5vh,14px)}
.tabs{display:inline-flex; gap:6px; margin-bottom:12px}
.tabs i{width:20px; height:44px; border-radius:5px; display:block; box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
h1{font-family:"Fraunces",serif; font-weight:700; margin:0; color:#fff; font-size:clamp(2.3rem,7vw,4rem); line-height:1; letter-spacing:.5px}
.sub{margin:12px 0 0; font-size:clamp(1.05rem,3vw,1.4rem); color:#b9c6d4; font-weight:500}

/* ---- type jump chips ---- */
.jump{display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:18px}
.jump a{display:inline-flex; align-items:center; gap:.45em; min-height:40px; padding:.35em 1.05em; border-radius:999px;
  text-decoration:none; font-weight:700; font-size:.98rem; color:var(--brass-hi);
  border:1px solid rgba(201,162,74,.55); background:rgba(10,18,28,.35); transition:background .14s, border-color .14s, color .14s}
.jump a:hover,.jump a:focus-visible{border-color:var(--brass-hi); color:#fff; background:rgba(201,162,74,.16); outline:none}
.jump a .n{font-weight:600; color:#8ea0b2; font-size:.88em}

/* ---- type sections ---- */
.type{margin-top:clamp(26px,4.5vh,44px); scroll-margin-top:16px}
.type-head{display:flex; align-items:flex-end; justify-content:space-between; gap:6px 16px; flex-wrap:wrap;
  padding-bottom:12px; margin-bottom:clamp(14px,2.5vw,20px); border-bottom:1px solid rgba(201,162,74,.3)}
.type-kicker{display:block; font-size:.74rem; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:var(--brass)}
.type-head h2{font-family:"Fraunces",serif; font-weight:700; margin:2px 0 0; color:#fff; font-size:clamp(1.7rem,4.6vw,2.35rem); line-height:1.05}
.type-head p{margin:4px 0 0; color:#b9c6d4; font-size:clamp(.98rem,2.4vw,1.1rem)}
.type-head .count{font-weight:700; color:#8ea0b2; font-size:.95rem; white-space:nowrap; padding-bottom:3px}

.games{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:clamp(14px,2.5vw,22px)}
.game{position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px;
  border-radius:26px; padding:clamp(22px,3vw,34px) 20px; cursor:pointer; text-decoration:none; color:var(--ink);
  background:var(--paper); box-shadow:0 18px 40px -18px rgba(0,0,0,.7), inset 0 0 0 4px rgba(255,255,255,.6);
  border:5px solid var(--accent); transition:transform .14s ease, box-shadow .14s ease}
.game:hover,.game:focus-visible{transform:translateY(-8px) scale(1.015); box-shadow:0 30px 60px -20px rgba(0,0,0,.8), inset 0 0 0 4px rgba(255,255,255,.85); outline:none}
.game:active{transform:translateY(-2px)}
.game .pic{width:clamp(110px,20vw,150px); height:clamp(110px,20vw,150px); border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--soft); border:5px solid var(--accent); box-shadow:inset 0 4px 12px rgba(0,0,0,.08)}
.game .pic .emoji{font-size:clamp(3.2rem,9vw,4.6rem); line-height:1}
.game .name{font-family:"Fraunces",serif; font-weight:700; font-size:clamp(1.5rem,4vw,2rem); color:var(--ink); line-height:1.05}
.game .desc{font-size:clamp(.95rem,2.4vw,1.08rem); color:#4a5568; line-height:1.4; max-width:22ch; min-height:2.6em}
.game .players{font-weight:700; font-size:.95rem; color:#6b7684}
.game .play{margin-top:4px; display:inline-flex; align-items:center; gap:10px; font-weight:800;
  font-size:clamp(1.1rem,3vw,1.35rem); color:#fff; background:var(--accent); border-radius:999px; padding:.55em 1.5em;
  box-shadow:0 8px 18px -6px var(--accent); letter-spacing:.03em}
.game:hover .play{filter:brightness(1.07)}
.game .play .tri{font-size:.9em; transition:transform .14s}
.game:hover .play .tri{transform:translateX(3px)}

.foot{text-align:center; margin-top:clamp(28px,5vh,48px); color:#8ea0b2; font-size:1rem; font-weight:500}
.foot b{color:#cdd8e3}
@media (prefers-reduced-motion:reduce){ *{transition-duration:.001ms!important} html{scroll-behavior:auto} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="tabs"><i style="background:var(--blue)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i><i style="background:var(--orange)"></i></div>
    <h1>IGAA Parlor</h1>
    <p class="sub">Pick a game to play</p>
    <nav class="jump" id="jump" aria-label="Game types"></nav>
  </div>
  <div id="sections"></div>
  <p class="foot">Tap a big card to start. Inside a game, tap <b>⌂ Parlor</b> to come back.</p>
</div>

<script>
/* =========================================================================
   GAME TYPES — the "Type:" line printed on each rule sheet.
   Sections show in this order; a type with no games is hidden.
   ========================================================================= */
const TYPES = [
  { key:"IGAA",  title:"IGAA",  blurb:"Make appointments: a season, a day, and a time." },
  { key:"Time",  title:"Time",  blurb:"Time cards, clocks, and telling time." },
  { key:"Other", title:"Other", blurb:"New twists on the season deck." },
];

/* =========================================================================
   ADD A NEW GAME HERE  ▸  add one entry, drop its .html file in this folder.
   Fields:  file (html filename) · type (IGAA | Time | Other, from the rule
            sheet's "Type:" line) · name · desc (one short line) · emoji ·
            players · accent (border/button color) · soft (icon bg color)
   ========================================================================= */
const GAMES = [
  // Type: IGAA
  { file:"IGAA-Beginner.html",          type:"IGAA",  name:"Appointment",            desc:"Match a season, a day, and a time in one color.", emoji:"📅", players:"2–8 players", accent:"#c78a2e", soft:"#f6e8cf" },
  { file:"IGAA-Advanced.html",          type:"IGAA",  name:"Appointment Plus",       desc:"The same game with mail and surprise cards.",      emoji:"✉️", players:"2–8 players", accent:"#7a5cc0", soft:"#ece5f8" },
  { file:"Appointment-Taker.html",      type:"IGAA",  name:"Appointment Taker",      desc:"Build, upgrade and TAKE the best appointments.",     emoji:"🎯", players:"2–4 players", accent:"#2f6fc0", soft:"#dbe7f5" },
  { file:"12-Appointments.html",        type:"IGAA",  name:"12 Appointments",        desc:"Claim all 12 appointment types before anyone else.", emoji:"🔢", players:"2–4 players", accent:"#2f9e4f", soft:"#d9ecdf" },
  { file:"Finish-the-Appointment.html", type:"IGAA",  name:"Finish the Appointment", desc:"Place the third card to finish each appointment.",    emoji:"🧩", players:"2–6 players", accent:"#e2701c", soft:"#f8e1cc" },
  { file:"Center-Stage.html",           type:"IGAA",  name:"Center Stage",           desc:"Spin, move, and grab the spotlight for Rainbow appointments.", emoji:"⭐", players:"2–4 players", accent:"#6f3aa3", soft:"#ece3f6" },
  { file:"Double-Appointment.html",     type:"IGAA",  name:"Double Appointment",     desc:"Swap cards through the INBOX — or get locked out.", emoji:"🔒", players:"2 or 4 players", accent:"#2f9e4f", soft:"#dcefe2" },
  { file:"Level-1-Seasons.html",        type:"IGAA",  name:"Level 1 Seasons",        desc:"Ride your season train and trade for an appointment.", emoji:"🚂", players:"2–4 players · ages 3+", accent:"#e2701c", soft:"#fbe6d4" },
  // Type: Time
  { file:"Ducks-on-the-Lake.html",      type:"Time",  name:"Ducks on the Lake",      desc:"Match Time cards so your duck can go for a swim.", emoji:"🦆", players:"2–4 players", accent:"#2f8fd0", soft:"#dcf0fb" },
  { file:"Time-to-Travel.html",         type:"Time",  name:"It's Time to Travel",    desc:"Move around the clock, spin down your ETA, tell the time.", emoji:"🚗", players:"2–4 players", accent:"#2f6fc0", soft:"#dde8f6" },
  // Type: Other
  { file:"Times-Up-Jr.html",            type:"Other", name:"Times Up",               desc:"Flip cards for sets — but don't wake the clock!",  emoji:"⏰", players:"2–8 players", accent:"#d1492f", soft:"#fbe0d9" },
  { file:"Priority-Mail.html",          type:"Other", name:"Priority Mail",          desc:"Match the deck to your mail. Five versions, I to V.", emoji:"📬", players:"2–4 players", accent:"#2f8f8a", soft:"#d8efec" },
  { file:"Season-Wheel.html",           type:"Other", name:"Season Wheel",           desc:"Build combos from 12 cards, then spin to finish them.", emoji:"🎡", players:"2–4 players", accent:"#2f9e4f", soft:"#dcefe2" },
];

/* ---- render (no need to edit below to add a game) ---- */
const slug = k => "type-" + k.toLowerCase();
const known = new Set(TYPES.map(t => t.key));
const groups = TYPES
  .map(t => ({ ...t, games: GAMES.filter(g => (known.has(g.type) ? g.type : "Other") === t.key) }))
  .filter(t => t.games.length);

const card = g => `
  <a class="game" href="${g.file}" style="--accent:${g.accent}; --soft:${g.soft}" aria-label="Play ${g.name}">
    <div class="pic"><span class="emoji" role="img" aria-hidden="true">${g.emoji}</span></div>
    <div class="name">${g.name}</div>
    <div class="desc">${g.desc}</div>
    <div class="players">${g.players}</div>
    <span class="play">Play <span class="tri">▶</span></span>
  </a>`;

document.getElementById("jump").innerHTML = groups.map(t =>
  `<a href="#${slug(t.key)}">${t.title} <span class="n">${t.games.length}</span></a>`).join("");

document.getElementById("sections").innerHTML = groups.map(t => `
  <section class="type" id="${slug(t.key)}" aria-labelledby="${slug(t.key)}-h">
    <div class="type-head">
      <div>
        <span class="type-kicker">Type</span>
        <h2 id="${slug(t.key)}-h">${t.title}</h2>
        <p>${t.blurb}</p>
      </div>
      <span class="count">${t.games.length} ${t.games.length === 1 ? "game" : "games"}</span>
    </div>
    <div class="games">${t.games.map(card).join("")}</div>
  </section>`).join("");
</script>
</body>
</html>
