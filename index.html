<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IGAA Parlor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<title>IGAA Parlor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a24'/%3E%3Crect x='12' y='14' width='9' height='12' rx='2' fill='%233d78bf'/%3E%3Crect x='22' y='14' width='9' height='12' rx='2' fill='%23e6b23a'/%3E%3Crect x='32' y='14' width='9' height='12' rx='2' fill='%2345a06a'/%3E%3Crect x='42' y='14' width='9' height='12' rx='2' fill='%23cf7620'/%3E%3Ctext x='32' y='47' font-family='Georgia' font-size='19' fill='%23e6d2a0' text-anchor='middle' font-weight='700'%3EIGAA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --paper:#fdfbf5; --ink:#20242b; --brass:#c9a24a;
  --blue:#3d78bf; --yellow:#e6b23a; --green:#45a06a; --orange:#cf7620; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; overflow-x:hidden; color:#e9edf2; -webkit-font-smoothing:antialiased;
  font-family:"Archivo",system-ui,"Segoe UI",sans-serif;
  background:#0e1826 radial-gradient(130% 90% at 50% 0%, #2b425c 0%, #20344a 40%, #0e1826 100%) fixed}
.wrap{max-width:980px; margin:0 auto; padding:clamp(20px,4vh,40px) clamp(16px,4vw,32px)}

.head{text-align:center; margin-bottom:clamp(14px,3vh,26px)}
.tabs{display:inline-flex; gap:5px; margin-bottom:10px}
.tabs i{width:14px; height:30px; border-radius:4px; display:block}
h1{font-family:"Fraunces",Georgia,serif; font-weight:700; margin:0; color:#fff; font-size:clamp(2rem,6vw,3rem); line-height:1}

h2{font-family:"Fraunces",Georgia,serif; font-weight:700; color:var(--brass); font-size:1.3rem;
  margin:clamp(18px,3vh,28px) 0 10px; padding-bottom:6px; border-bottom:1px solid rgba(201,162,74,.3)}

.games{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.game{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; text-decoration:none;
  padding:16px 10px 14px; border-radius:16px; background:var(--paper); color:var(--ink);
  border-top:6px solid var(--accent); box-shadow:0 10px 24px -14px rgba(0,0,0,.8);
  transition:transform .12s ease, box-shadow .12s ease}
.game:hover,.game:focus-visible{transform:translateY(-4px); box-shadow:0 18px 34px -16px rgba(0,0,0,.9); outline:none}
.game:focus-visible{box-shadow:0 0 0 3px #f1d58c}
.game .emoji{font-size:2.3rem; line-height:1}
.game .name{font-family:"Fraunces",Georgia,serif; font-weight:700; font-size:1.12rem; line-height:1.1}
.game .players{font-size:.85rem; font-weight:600; color:#6b7684}
@media (prefers-reduced-motion:reduce){ .game{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="tabs"><i style="background:var(--blue)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i><i style="background:var(--orange)"></i></div>
    <h1>IGAA Parlor</h1>
  </div>
  <div id="sections"></div>
</div>

<script>
/* =========================================================================
   ADD A NEW GAME HERE  ▸  add one entry, drop its .html file in this folder.
   type = the "Type:" line on the game's rule sheet (IGAA | Time | Other).
   desc shows as the tile's tooltip.
   ========================================================================= */
const TYPES = ["IGAA", "Time", "Other"];   // section order

const GAMES = [
  { file:"IGAA-Beginner.html",          type:"IGAA",  name:"Appointment",            emoji:"📅", players:"2–8 players",    accent:"#c78a2e", desc:"Match a season, a day, and a time in one color." },
  { file:"IGAA-Advanced.html",          type:"IGAA",  name:"Appointment Plus",       emoji:"✉️", players:"2–8 players",    accent:"#7a5cc0", desc:"The same game with mail and surprise cards." },
  { file:"Appointment-Taker.html",      type:"IGAA",  name:"Appointment Taker",      emoji:"🎯", players:"2–4 players",    accent:"#2f6fc0", desc:"Build, upgrade and TAKE the best appointments." },
  { file:"12-Appointments.html",        type:"IGAA",  name:"12 Appointments",        emoji:"🔢", players:"2–4 players",    accent:"#2f9e4f", desc:"Claim all 12 appointment types before anyone else." },
  { file:"Finish-the-Appointment.html", type:"IGAA",  name:"Finish the Appointment", emoji:"🧩", players:"2–6 players",    accent:"#e2701c", desc:"Place the third card to finish each appointment." },
  { file:"Center-Stage.html",           type:"IGAA",  name:"Center Stage",           emoji:"⭐", players:"2–4 players",    accent:"#6f3aa3", desc:"Spin, move, and grab the spotlight for Rainbow appointments." },
  { file:"Double-Appointment.html",     type:"IGAA",  name:"Double Appointment",     emoji:"🔒", players:"2 or 4 players", accent:"#2f9e4f", desc:"Swap cards through the INBOX — or get locked out." },
  { file:"Level-1-Seasons.html",        type:"IGAA",  name:"Level 1 Seasons",        emoji:"🚂", players:"2–4 · ages 3+",  accent:"#e2701c", desc:"Ride your season train and trade for an appointment." },
  { file:"Ducks-on-the-Lake.html",      type:"Time",  name:"Ducks on the Lake",      emoji:"🦆", players:"2–4 players",    accent:"#2f8fd0", desc:"Match Time cards so your duck can go for a swim." },
  { file:"Time-to-Travel.html",         type:"Time",  name:"It's Time to Travel",    emoji:"🚗", players:"2–4 players",    accent:"#2f6fc0", desc:"Move around the clock, spin down your ETA, tell the time." },
  { file:"Times-Up-Jr.html",            type:"Other", name:"Times Up",               emoji:"⏰", players:"2–8 players",    accent:"#d1492f", desc:"Flip cards for sets — but don't wake the clock!" },
  { file:"Priority-Mail.html",          type:"Other", name:"Priority Mail",          emoji:"📬", players:"2–4 players",    accent:"#2f8f8a", desc:"Match the deck to your mail. Five versions, I to V." },
  { file:"Season-Wheel.html",           type:"Other", name:"Season Wheel",           emoji:"🎡", players:"2–4 players",    accent:"#2f9e4f", desc:"Build combos from 12 cards, then spin to finish them." },
];

/* ---- render (no need to edit below) ---- */
document.getElementById("sections").innerHTML = TYPES.map(type => {
  const games = GAMES.filter(g => (TYPES.includes(g.type) ? g.type : "Other") === type);
  if (!games.length) return "";
  return `<h2>${type}</h2><div class="games">` + games.map(g => `
    <a class="game" href="${g.file}" style="--accent:${g.accent}" title="${g.desc}">
      <span class="emoji" aria-hidden="true">${g.emoji}</span>
      <span class="name">${g.name}</span>
      <span class="players">${g.players}</span>
    </a>`).join("") + `</div>`;
}).join("");
</script>
</body>
</html>
