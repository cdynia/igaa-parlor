<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a24">
<title>Not on the calendar · IGAA Parlor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101a24'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23e4c883' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brass:#b98a3c; --brass-hi:#e4c883; --brass-deep:#8a6526;
  --line-2:rgba(240,235,220,.16); --muted:#9aa6b2; --muted-2:#c7d0d9; --paper:#f4efe3;
  --blue:#2f6fc0; --gold:#c99105; --green:#2f9e4f; --orange:#e2701c;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{color:var(--muted-2); font-family:"Archivo",system-ui,"Segoe UI",sans-serif;
  background:radial-gradient(120% 90% at 50% 6%, #223141 0%, #16222e 42%, #0c141c 100%);
  display:flex; align-items:center; justify-content:center; padding:24px 18px;
  -webkit-font-smoothing:antialiased}
.wrap{width:100%; max-width:620px; text-align:center}
h1{font-family:"Fraunces","Georgia",serif; color:var(--paper); font-weight:600;
  font-size:clamp(1.5rem,5.2vw,2.15rem); margin:22px 0 0; line-height:1.15}
p{font-size:clamp(.95rem,2.6vw,1.05rem); line-height:1.55; color:var(--muted); margin:12px auto 0; max-width:46ch}
.code{font-family:"Fraunces",serif; letter-spacing:.32em; font-size:.8rem; color:var(--brass);
  text-transform:uppercase; margin-top:6px}

/* the clock reads 4:04 — of course it does */
.clock{width:clamp(150px,44vw,196px); height:clamp(150px,44vw,196px); margin:0 auto;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.5))}
.clock .case{fill:var(--orange)}
.clock .face{fill:#fbfaf5; stroke:rgba(0,0,0,.14); stroke-width:.5}
.clock .rim{fill:none; stroke:rgba(0,0,0,.28); stroke-width:1.5}
.clock .tick{stroke:#9aa3ac; stroke-width:1; stroke-linecap:round}
.clock .tick.big{stroke:#3d444c; stroke-width:2.2}
.clock .num{fill:#232930; font-family:"Archivo",sans-serif; font-weight:700; font-size:9.6px;
  text-anchor:middle; dominant-baseline:central}
.clock .hand{stroke-linecap:round}
.clock .hr{stroke:var(--orange); stroke-width:5}
.clock .mn{stroke:#4a525b; stroke-width:3.1}
.clock .pin{fill:#3d444c}
.clock .maker{fill:#b3bac2; font-family:"Fraunces",serif; font-weight:600; font-size:3.4px;
  letter-spacing:.5px; text-anchor:middle}

.acts{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:24px}
.btn{border:1px solid var(--brass-deep); cursor:pointer; color:#211a0c; text-decoration:none; display:inline-block;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass));
  padding:.72em 1.4em; border-radius:9px; font-weight:600; font-size:.98rem;
  box-shadow:0 2px 0 var(--brass-deep),0 8px 18px -8px rgba(0,0,0,.7)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; color:var(--muted-2); border-color:var(--line-2); box-shadow:none; font-weight:500}
.btn.ghost:hover{border-color:var(--brass); color:var(--brass-hi)}

.picks{margin-top:26px; border-top:1px solid rgba(240,235,220,.10); padding-top:18px}
.picks .lbl{font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.picks ul{list-style:none; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:0; margin:12px 0 0}
.picks a{display:flex; align-items:center; gap:7px; text-decoration:none; color:var(--paper); font-size:.9rem; font-weight:600;
  border:1px solid var(--line-2); border-radius:999px; padding:.45em .95em; background:rgba(255,255,255,.03)}
.picks a:hover{border-color:var(--accent,var(--brass)); color:var(--brass-hi)}
.picks a i{width:9px; height:9px; border-radius:50%; background:var(--accent); display:block}
.foot{margin-top:24px; font-size:.76rem; color:#6f7b87}
</style>
</head>
<body>
<div class="wrap">
  <svg class="clock" viewBox="0 0 100 100" role="img" aria-label="A clock showing four minutes past four">
    <circle class="case" cx="50" cy="50" r="48"></circle>
    <circle class="rim" cx="50" cy="50" r="42.7"></circle>
    <circle class="face" cx="50" cy="50" r="42"></circle>
    <g id="ticks"></g>
    <text class="maker" x="50" y="64">IGAA PARLOR</text>
    <g id="nums"></g>
    <!-- 4:04 -->
    <line class="hand mn" x1="50" y1="50" x2="57.5" y2="15.8"></line>
    <line class="hand hr" x1="50" y1="50" x2="63.3" y2="63.3"></line>
    <circle class="pin" cx="50" cy="50" r="3"></circle>
  </svg>

  <div class="code">Error 404</div>
  <h1>That appointment isn’t on our calendar.</h1>
  <p>We looked through every season, day and time — there’s no page here.
     It may have been renamed, or the link had a typo.</p>

  <div class="acts">
    <a class="btn" id="home" href="index.html">← Back to the Parlor</a>
    <button class="btn ghost" onclick="history.back()">Go back</button>
  </div>

  <div class="picks">
    <div class="lbl">Or jump straight into a game</div>
    <ul id="picks"></ul>
  </div>

  <div class="foot">IGAA Parlor · I’ve Got an Appointment</div>
</div>

<script>
/* This page is served for ANY missing path, at any depth, so work out the
   site root rather than trusting relative links. */
var base = (function () {
  var p = location.pathname;
  if (/\.github\.io$/i.test(location.hostname)) {
    var seg = p.split("/")[1];
    return seg ? "/" + seg + "/" : "/";
  }
  return "/";
})();

document.getElementById("home").href = base + "index.html";

var PICKS = [
  { file:"IGAA-Beginner.html", name:"Appointment",   c:"var(--gold)"   },
  { file:"Times-Up-Jr.html",   name:"Times Up",      c:"var(--orange)" },
  { file:"Set-the-Clock.html", name:"Set the Clock", c:"var(--blue)"   },
  { file:"Priority-Mail.html", name:"Priority Mail", c:"var(--green)"  }
];
document.getElementById("picks").innerHTML = PICKS.map(function (g) {
  return '<li><a href="' + base + g.file + '" style="--accent:' + g.c + '"><i></i>' + g.name + "</a></li>";
}).join("");

/* dial */
(function () {
  var t = "", n = "", i, h, a, r1;
  for (i = 0; i < 60; i++) {
    var big = i % 5 === 0;
    a = (i * 6 - 90) * Math.PI / 180;
    r1 = big ? 36.5 : 38.6;
    t += '<line class="tick' + (big ? " big" : "") + '" x1="' + (50 + r1 * Math.cos(a)).toFixed(2) +
         '" y1="' + (50 + r1 * Math.sin(a)).toFixed(2) + '" x2="' + (50 + 40.6 * Math.cos(a)).toFixed(2) +
         '" y2="' + (50 + 40.6 * Math.sin(a)).toFixed(2) + '"></line>';
  }
  for (h = 1; h <= 12; h++) {
    a = (h * 30 - 90) * Math.PI / 180;
    n += '<text class="num" x="' + (50 + 30.5 * Math.cos(a)).toFixed(2) +
         '" y="' + (50 + 30.5 * Math.sin(a)).toFixed(2) + '">' + h + "</text>";
  }
  document.getElementById("ticks").innerHTML = t;
  document.getElementById("nums").innerHTML = n;
})();
</script>
</body>
</html>
